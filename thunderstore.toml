[config]

schemaVersion = "0.0.1"



[general]

repository = "https://github.com/BinderDyn/german-brainrot"



[package]

namespace = "BinderDyn"

name = "GermanBrainrot"

description = "A mod that plays various sounds of famous meme worthy streamers from Germany instead of the default mob sounds, synced across all players."

websiteUrl = "https://github.com/BinderDyn/german-brainrot"

containsNsfwContent = false



[package.dependencies]

BepInEx-BepInExPack = "5.4.2100"



[build]

icon = "icon.png"

readme = "README.md"

outdir = "build"



[[build.copy]]

source = "Template/bin/GermanBrainrot.dll"

target = "BepInEx/plugins/GermanBrainrot/GermanBrainrot.dll"



[[build.copy]]

source = "Template/bin/Concentus.dll"

target = "BepInEx/plugins/GermanBrainrot/Concentus.dll"



[[build.copy]]

source = "Template/bin/Concentus.Oggfile.dll"

target = "BepInEx/plugins/GermanBrainrot/Concentus.Oggfile.dll"



[[build.copy]]

source = "Template/config/creature-profiles.json"

target = "BepInEx/plugins/GermanBrainrot/config/creature-profiles.json"



[[build.copy]]

source = "Template/audio/packs/"

target = "BepInEx/plugins/GermanBrainrot/audio/packs/"



[[build.copy]]

source = "CHANGELOG.md"

target = "CHANGELOG.md"



[[build.copy]]

source = "LICENSE"

target = "LICENSE"



[publish]

communities = ["lethal-company"]



[publish.categories]

lethal-company = ["bepinex", "mods", "german brainrot", "germanbrainrot"]

